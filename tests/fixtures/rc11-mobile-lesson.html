<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>*{box-sizing:border-box}body{margin:0;background:#f5f8f6;font:16px Arial,sans-serif;color:#20382f}.pg{padding:14px}.card{background:#fff;border:1px solid #d6e4dd;border-radius:17px;margin:14px 0;padding:24px}.ch{font-size:18px;font-weight:bold;margin-bottom:14px}.fld{margin-bottom:14px}.fld select,.fld input{padding:12px;border:1px solid #bbcfc4;border-radius:12px;width:100%;font:inherit}.frow{display:flex;gap:8px}.frow>*{flex:1;min-width:0}.status-btns{display:flex;gap:12px}.st-btn{border:1px solid #aec5b8;background:#f4f7f5;border-radius:12px;min-height:52px;flex:1;font:inherit}.v9-session-steps{background:#fff;padding:16px;margin:16px 0;border:1px solid #d4e1db;border-radius:16px}.v9-step-row{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.v9-step-btn{padding:12px 3px;font-size:13px}.card h3{margin:0 0 15px}.large-control{min-height:100px;border-bottom:1px solid #dde8e1;padding:18px 0}.bottom-nav{height:68px;position:fixed;bottom:0;left:0;right:0;background:#153c31;z-index:20;color:#fff;display:flex;justify-content:center;align-items:center}</style>
<link rel="stylesheet" href="../../css/platform/rc9-lesson-flow.css"><link rel="stylesheet" href="../../css/platform/rc10-teacher-fast-path.css">
<script>const rc11=new URLSearchParams(location.search).get('rc11')!=='0';if(rc11)document.write('<link rel="stylesheet" href="../../css/platform/rc11-teacher-flow.css">');</script></head>
<body class="imam-design-bridge"><div class="pg on v9-guided" id="pg-session" data-ia-session-step="assessment">
<div class="card ia21-student-card" id="ia21SessionStudent"><div class="ch">👤 الطالب</div><div class="fld"><select id="sesSt"><option value="">اختر الطالب</option><option value="s1" selected>الطالب التجريبي</option></select></div><button type="button" id="beta19SessionBoard">🖍️ افتح السبورة لهذا الطالب</button><div class="frow"><div class="fld"><label>تاريخ الحصة</label><input type="date" id="sesDate" value="2026-11-21"></div><div class="fld"><label>الحفظ التلقائي</label><div id="draftState">محفوظ محليًا</div></div></div><div class="fld">حالة الحضور</div><div class="status-btns"><button class="st-btn">✅ حضر</button><button class="st-btn">❌ غاب</button><button class="st-btn">🌙 إجازة</button></div></div>
<div id="v9SessionSteps" class="v9-session-steps"><div class="v9-step-row"><button type="button" data-step="assessment" class="v9-step-btn on" onclick="setSessionStep('assessment')">التسميع</button><button type="button" data-step="new" class="v9-step-btn" onclick="setSessionStep('new')">الحفظ</button><button type="button" data-step="review" class="v9-step-btn" onclick="setSessionStep('review')">المراجعة</button><button type="button" data-step="notes" class="v9-step-btn" onclick="setSessionStep('notes')">الملاحظات</button></div></div>
<div id="sesContent"><div class="card" id="assessment-card" data-v9-step="assessment"><h3>تسميع الحصة السابقة</h3><div class="large-control">مراجعة موضع التسميع</div><div class="large-control">اختيار نتيجة التقييم</div><div class="large-control">تسجيل الأخطاء</div><div class="large-control">محتوى الحصة</div></div><div class="card" data-v9-step="new">الحفظ الجديد</div><div class="card" data-v9-step="review">المراجعة</div><div class="card" data-v9-step="notes">الملاحظات</div><section id="v9SessionFooter"><button id="saveSessionBtn">حفظ</button><button id="saveSendSessionBtn">حفظ وإرسال لولي الأمر</button></section></div>
</div><nav class="bottom-nav">الرئيسية　|　الحصة الحالية</nav>
<script>function setSessionStep(x){document.querySelector('#pg-session').dataset.iaSessionStep=x;document.querySelector('#v9SessionFooter').hidden=x!=='notes';}setSessionStep('assessment');</script>
