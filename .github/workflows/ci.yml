name: Imam Academy CI

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run release checks
        run: npm test
      - name: Verify release hashes
        run: node scripts/release-integrity.mjs
      - name: Check linked payload budget
        run: node scripts/release-budget.mjs
