name: Imam Academy CI

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run release checks
        run: npm test
      - name: Generate canonical RC16 inventory snapshot (temporary maintenance step)
        run: |
          node scripts/release-integrity.mjs --write
          node -e "const fs=require('node:fs'); console.log('RC16_SHA256_B64='+fs.readFileSync('SHA256SUMS.txt').toString('base64'))"
      - name: Verify release hashes
        run: node scripts/release-integrity.mjs
      - name: Check linked payload budget
        run: node scripts/release-budget.mjs
