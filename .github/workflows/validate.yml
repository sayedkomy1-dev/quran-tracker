name: Validate Imam Academy PWA
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static checks
        run: npm test
      - name: JavaScript syntax checks
        shell: bash
        run: |
          set -e
          while IFS= read -r file; do node --check "$file"; done < <(find assets/js -name '*.js' -type f | sort)
      - name: Verify PWA manifest
        run: node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));if(m.display!=='standalone'||!m.icons?.length)process.exit(1)"
